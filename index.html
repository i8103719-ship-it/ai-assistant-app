<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#101114">
  <title>AI Assistant</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101114; --panel: #181a20; --panel2: #20232b;
      --text: #f4f5f7; --muted: #9298a5; --line: #2a2d36;
      --accent: #8b7cff; --accent2: #6d5ce8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
      font: 15px/1.55 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .app { max-width: 860px; height: 100dvh; margin: auto; display: flex; flex-direction: column; }
    header {
      display: flex; align-items: center; gap: 12px; padding: 16px 18px;
      border-bottom: 1px solid var(--line); background: rgba(16,17,20,.92);
    }
    .logo {
      width: 38px; height: 38px; border-radius: 13px; display: grid; place-items: center;
      background: linear-gradient(135deg, #a99dff, #6554dd); color: white; font-size: 20px;
      box-shadow: 0 5px 22px #7665ed44;
    }
    .brand { font-weight: 700; letter-spacing: -.2px; }
    .status { color: var(--muted); font-size: 12px; }
    .status:before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #54d69a; margin-right: 6px; }
    #messages { flex: 1; overflow-y: auto; padding: 24px 18px 18px; scroll-behavior: smooth; }
    .welcome { max-width: 510px; margin: 12vh auto 0; text-align: center; }
    .welcome .spark { font-size: 34px; }
    .welcome h1 { font-size: clamp(25px, 5vw, 34px); margin: 12px 0 8px; letter-spacing: -1px; }
    .welcome p { color: var(--muted); margin: 0 auto; max-width: 380px; }
    .message { display: flex; margin: 0 auto 18px; max-width: 720px; gap: 10px; align-items: flex-start; }
    .message.user { justify-content: flex-end; }
    .bubble { max-width: min(82%, 650px); padding: 12px 15px; border-radius: 17px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .assistant .bubble { background: var(--panel); border: 1px solid var(--line); border-top-left-radius: 5px; }
    .user .bubble { background: linear-gradient(135deg, #7668e8, #6556cf); border-top-right-radius: 5px; }
    .avatar { width: 28px; height: 28px; flex: 0 0 28px; border-radius: 10px; display: grid; place-items: center; background: var(--panel2); font-size: 13px; }
    .typing { display: inline-flex; gap: 5px; padding: 5px 2px; }
    .typing i { width: 6px; height: 6px; background: #a9a3ff; border-radius: 50%; animation: pulse 1s infinite ease-in-out; }
    .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
    @keyframes pulse { 0%, 60%, 100% { transform: translateY(0); opacity: .45; } 30% { transform: translateY(-5px); opacity: 1; } }
    .composer-wrap { padding: 12px 16px max(16px, env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--bg); }
    .composer { max-width: 760px; margin: auto; display: flex; align-items: flex-end; gap: 9px; padding: 8px; background: var(--panel); border: 1px solid #343743; border-radius: 18px; box-shadow: 0 8px 30px #0003; }
    textarea { flex: 1; resize: none; min-height: 40px; max-height: 140px; padding: 10px 8px; border: 0; outline: 0; color: var(--text); background: transparent; font: inherit; }
    textarea::placeholder { color: #777d8b; }
    button { width: 42px; height: 42px; flex: 0 0 42px; border: 0; border-radius: 13px; color: white; background: var(--accent2); font-size: 19px; cursor: pointer; }
    button:disabled { opacity: .45; cursor: default; }
    .hint { text-align: center; color: #666c79; font-size: 11px; padding-top: 8px; }
    .error { color: #ff9292; }
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">✦</div>
    <div><div class="brand">AI Assistant</div><div class="status">Готов к диалогу</div></div>
  </header>
  <main id="messages" aria-live="polite">
    <section class="welcome" id="welcome">
      <div class="spark">✧</div>
      <h1>Чем могу помочь?</h1>
      <p>Задайте вопрос, попросите объяснить сложную тему или придумать новую идею.</p>
    </section>
  </main>
  <div class="composer-wrap">
    <form class="composer" id="form">
      <textarea id="input" rows="1" placeholder="Напишите сообщение..." autocomplete="off"></textarea>
      <button id="send" type="submit" aria-label="Отправить">↑</button>
    </form>
    <div class="hint">AI может ошибаться. Проверяйте важную информацию.</div>
  </div>
</div>
<script>
  const tg = window.Telegram?.WebApp;
  tg?.ready();
  tg?.expand();

  const API_BASE = "https://web-production-79040.up.railway.app";
  const messages = document.getElementById("messages");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  let busy = false;

  function scrollDown() { messages.scrollTop = messages.scrollHeight; }
  function addMessage(role, text, typing = false) {
    document.getElementById("welcome")?.remove();
    const row = document.createElement("div");
    row.className = `message ${role}`;
    if (role === "assistant") {
      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = "✦";
      row.appendChild(avatar);
    }
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    if (typing) {
      bubble.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
      row.dataset.typing = "true";
    } else {
      bubble.textContent = text;
    }
    row.appendChild(bubble);
    messages.appendChild(row);
    scrollDown();
    return row;
  }

  async function submitMessage(text) {
    if (busy || !text.trim()) return;
    busy = true;
    send.disabled = true;
    addMessage("user", text.trim());
    input.value = "";
    input.style.height = "40px";
    const loader = addMessage("assistant", "", true);

    try {
      const response = await fetch(`${API_BASE}/api/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text.trim(), initData: tg?.initData || "" })
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || data.message || `Ошибка сервера (${response.status})`);
      loader.remove();
      addMessage("assistant", data.reply || "Пустой ответ от AI.");
    } catch (error) {
      loader.remove();
      const row = addMessage("assistant", `Не удалось отправить сообщение: ${error.message}`);
      row.querySelector(".bubble").classList.add("error");
    } finally {
      busy = false;
      send.disabled = false;
      input.focus();
    }
  }

  form.addEventListener("submit", (event) => {
    event.preventDefault();
    submitMessage(input.value);
  });
  input.addEventListener("input", () => {
    input.style.height = "40px";
    input.style.height = Math.min(input.scrollHeight, 140) + "px";
  });
  input.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      form.requestSubmit();
    }
  });
</script>
</body>
</html>
